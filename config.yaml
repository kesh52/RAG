# Central configuration file for models, database settings, and pipeline parameters.
# Sensitive configurations resolve dynamically using environment variables (${VAR_NAME:default_value}).

database:
  type: "cloud_sql"
  host: "${DB_HOST:127.0.0.1}"
  port: "${DB_PORT:5432}"
  name: "${DB_NAME:vector}"
  user: "${DB_USER:postgres}"
  password: "${DB_PASSWORD:}"
  instance_connection_name: "${INSTANCE_CONNECTION_NAME:woven-spring-288610:europe-west3:free-trial-first-project}"
  impersonate_service_account: "${IMPERSONATE_SERVICE_ACCOUNT:}"
  ip_type: "${DB_IP_TYPE:public}"

gcp:
  project: "${GCP_PROJECT:woven-spring-288610}"
  location: "${GCP_LOCATION:europe-west3}"

models:
  embedding: "text-embedding-005"
  rerank: "semantic-ranker-512@latest"
  generation: "gemini-2.5-flash"

pipeline:
  pool_size: 5
  final_top_k: 2
  chunk_size: 500
  chunk_overlap: 50

logging:
  level: "INFO"
  file_path: "logs/pipeline.log"

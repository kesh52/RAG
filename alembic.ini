# A generic, single-database configuration for Alembic.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate new migration files
file_template = %%(rev)s_%%(slug)s

# sys.path path additions.
prepend_sys_path = .

# version table name
version_locations = %(here)s/alembic/versions

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt = %H:%M:%S


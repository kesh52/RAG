<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Chat Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f7ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
            darkbg: '#131314',
            darksidebar: '#1e1f20',
            darkcard: '#282a2c',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    .prose p { margin-bottom: 0.75rem; }
    .prose h3 { margin-top: 1.25rem; margin-bottom: 0.5rem; font-weight: 700; font-size: 1.1rem; color: #60a5fa; }
    .prose code { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.875rem; }
    .prose pre { background: #18181b; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
    .prose ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body class="bg-darkbg text-gray-100 flex h-screen overflow-hidden font-sans antialiased">

  <!-- Sidebar -->
  <aside class="w-72 bg-darksidebar border-r border-gray-800 flex flex-col flex-shrink-0 transition-all duration-200">
    <!-- User Profile Header -->
    <div class="p-4 border-b border-gray-800">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-white shadow-md">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div>
          <h1 class="text-sm font-semibold text-gray-200 leading-none">RAG Assistant</h1>
          <span class="text-xs text-green-400">● Online</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <input type="email" id="userEmailInput" value="john.doe@mail.com" class="w-full bg-darkbg text-xs px-2.5 py-1.5 rounded border border-gray-700 focus:outline-none focus:border-blue-500 text-gray-300" placeholder="User email...">
        <button id="refreshUserChatsBtn" title="Refresh chats" class="text-gray-400 hover:text-white p-1.5 rounded hover:bg-gray-700 text-xs">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>
    </div>

    <!-- New Chat Button -->
    <div class="p-3">
      <button id="newChatBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-3 rounded-lg text-sm flex items-center justify-center gap-2 transition shadow-sm">
        <i class="fa-solid fa-plus text-xs"></i> New Conversation
      </button>
    </div>

    <!-- Chat History List -->
    <div class="flex-1 overflow-y-auto px-3 py-1 space-y-1" id="chatListContainer">
      <!-- Chat items loaded dynamically -->
    </div>

    <!-- Footer Info -->
    <div class="p-3 border-t border-gray-800 text-xs text-gray-500 flex justify-between items-center">
      <span>FastAPI + Gemini RAG</span>
      <a href="/docs" target="_blank" class="text-blue-400 hover:underline">API Docs</a>
    </div>
  </aside>

  <!-- Main Chat Content -->
  <main class="flex-1 flex flex-col h-full bg-darkbg relative">
    
    <!-- Top Navigation Bar -->
    <header class="h-14 border-b border-gray-800 flex items-center justify-between px-6 bg-darkbg z-10">
      <div class="flex items-center gap-3">
        <h2 id="activeChatTitle" class="font-semibold text-gray-200 text-base">New Conversation</h2>
        <span id="activeChatId" class="text-xs text-gray-500 font-mono hidden md:inline"></span>
      </div>
      <div class="flex items-center gap-2">
        <button id="exportMdBtn" title="Export transcript" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded border border-gray-700 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-download"></i> Export
        </button>
        <button id="deleteChatBtn" title="Archive chat" class="text-xs bg-gray-800 hover:bg-red-900/40 text-gray-400 hover:text-red-400 px-3 py-1.5 rounded border border-gray-700 transition">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </header>

    <!-- Message Thread Container -->
    <div id="messagesContainer" class="flex-1 overflow-y-auto px-4 md:px-20 lg:px-40 py-6 space-y-6">
      <!-- Dynamic Messages rendered here -->
    </div>

    <!-- Bottom Chat Input Bar -->
    <div class="p-4 md:px-20 lg:px-40 bg-darkbg border-t border-gray-800/80">
      
      <!-- Attachment Chip Preview (if selected) -->
      <div id="attachmentPreviewChip" class="hidden mb-2 items-center gap-2 bg-gray-800 border border-gray-700 text-xs px-3 py-1.5 rounded-lg w-fit">
        <i class="fa-solid fa-paperclip text-blue-400"></i>
        <span id="attachmentFileName" class="text-gray-200 font-medium truncate max-w-xs"></span>
        <button id="removeAttachmentBtn" class="text-gray-400 hover:text-red-400 ml-2">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Input Box -->
      <form id="chatForm" class="flex items-end gap-2 bg-darksidebar border border-gray-700 rounded-xl p-2 focus-within:border-blue-500 transition shadow-lg">
        <label for="fileAttachmentInput" class="p-2 text-gray-400 hover:text-white cursor-pointer rounded-lg hover:bg-gray-700 transition" title="Attach PDF, image, log, or text">
          <i class="fa-solid fa-paperclip text-sm"></i>
          <input type="file" id="fileAttachmentInput" class="hidden" accept=".pdf,.txt,.log,.json,.md,.png,.jpg,.jpeg">
        </label>

        <textarea id="messageInput" rows="1" class="flex-1 bg-transparent text-gray-100 placeholder-gray-500 text-sm resize-none focus:outline-none py-1.5 px-2 max-h-36" placeholder="Ask a technical question or explain an issue..."></textarea>

        <button type="submit" id="sendBtn" class="bg-blue-600 hover:bg-blue-700 disabled:opacity-40 text-white p-2 rounded-lg transition shadow">
          <i class="fa-solid fa-arrow-up text-sm"></i>
        </button>
      </form>
      <div class="text-center mt-2 text-[11px] text-gray-500">
        Answers are grounded in company internal runbooks with Vertex semantic reranking.
      </div>
    </div>
  </main>

  <!-- Client Script -->
  <script>
    let activeSessionId = null;
    let activeUserEmail = document.getElementById("userEmailInput").value.trim();
    let currentAttachmentFile = null;

    const messagesContainer = document.getElementById("messagesContainer");
    const chatListContainer = document.getElementById("chatListContainer");
    const activeChatTitle = document.getElementById("activeChatTitle");
    const activeChatId = document.getElementById("activeChatId");
    const messageInput = document.getElementById("messageInput");
    const fileAttachmentInput = document.getElementById("fileAttachmentInput");
    const attachmentPreviewChip = document.getElementById("attachmentPreviewChip");
    const attachmentFileName = document.getElementById("attachmentFileName");
    const removeAttachmentBtn = document.getElementById("removeAttachmentBtn");

    // Auto-resize textarea
    messageInput.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = (this.scrollHeight) + "px";
    });

    messageInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        document.getElementById("chatForm").dispatchEvent(new Event("submit"));
      }
    });

    // File Attachment Handler
    fileAttachmentInput.addEventListener("change", (e) => {
      if (e.target.files.length > 0) {
        currentAttachmentFile = e.target.files[0];
        attachmentFileName.textContent = currentAttachmentFile.name;
        attachmentPreviewChip.classList.remove("hidden");
        attachmentPreviewChip.classList.add("flex");
      }
    });

    removeAttachmentBtn.addEventListener("click", () => {
      currentAttachmentFile = null;
      fileAttachmentInput.value = "";
      attachmentPreviewChip.classList.add("hidden");
      attachmentPreviewChip.classList.remove("flex");
    });

    // Load User Chats
    async function loadUserChats() {
      activeUserEmail = document.getElementById("userEmailInput").value.trim();
      try {
        const res = await fetch(`/api/v1/users/${encodeURIComponent(activeUserEmail)}/chats?limit=30`);
        const data = await res.json();
        chatListContainer.innerHTML = "";

        if (data.chats && data.chats.length > 0) {
          data.chats.forEach(chat => {
            const btn = document.createElement("button");
            const isActive = chat.id === activeSessionId;
            btn.className = `w-full text-left px-3 py-2.5 rounded-lg text-xs flex items-center justify-between group transition ${
              isActive ? "bg-gray-800 text-white font-medium border border-gray-700" : "text-gray-400 hover:bg-gray-800/60 hover:text-gray-200"
            }`;
            btn.innerHTML = `
              <div class="truncate flex-1 mr-2">
                <div class="truncate font-medium">${chat.title}</div>
                <div class="text-[10px] text-gray-500 truncate">${chat.last_message_preview || "No messages yet"}</div>
              </div>
              <span class="text-[10px] text-gray-500">${chat.message_count || 0}</span>
            `;
            btn.onclick = () => selectChat(chat.id);
            chatListContainer.appendChild(btn);
          });

          if (!activeSessionId) {
            selectChat(data.chats[0].id);
          }
        } else {
          chatListContainer.innerHTML = `<div class="p-3 text-xs text-gray-500 text-center">No conversations yet.</div>`;
          createNewChat();
        }
      } catch (err) {
        console.error("Error loading chats:", err);
      }
    }

    // Create New Chat
    async function createNewChat() {
      activeUserEmail = document.getElementById("userEmailInput").value.trim();
      try {
        const res = await fetch("/api/v1/chats", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_email: activeUserEmail, title: "New Conversation" }),
        });
        const chat = await res.json();
        activeSessionId = chat.id;
        await loadUserChats();
        selectChat(chat.id);
      } catch (err) {
        console.error("Error creating chat:", err);
      }
    }

    // Select and Load Chat
    async function selectChat(chatId) {
      activeSessionId = chatId;
      try {
        const res = await fetch(`/api/v1/chats/${chatId}`);
        const data = await res.json();
        activeChatTitle.textContent = data.session.title;
        activeChatId.textContent = `ID: ${data.session.id.substring(0, 8)}...`;
        renderMessages(data.messages);
        loadUserChats();
      } catch (err) {
        console.error("Error loading chat:", err);
      }
    }

    // Render Messages
    function renderMessages(messages) {
      messagesContainer.innerHTML = "";
      if (!messages || messages.length === 0) {
        messagesContainer.innerHTML = `
          <div class="flex flex-col items-center justify-center h-80 text-center text-gray-500">
            <div class="w-12 h-12 rounded-2xl bg-blue-600/10 text-blue-400 flex items-center justify-center text-2xl mb-3">
              <i class="fa-solid fa-comments"></i>
            </div>
            <h3 class="text-base font-semibold text-gray-300 mb-1">How can I assist you today?</h3>
            <p class="text-xs text-gray-500 max-w-sm">Ask about internal runbooks, troubleshooting procedures, or upload incident reports.</p>
          </div>
        `;
        return;
      }

      messages.forEach(msg => {
        appendMessageUI(msg);
      });
      scrollToBottom();
    }

    function appendMessageUI(msg) {
      const isUser = msg.role === "user";
      const div = document.createElement("div");
      div.className = `flex gap-3.5 ${isUser ? "justify-end" : "justify-start"}`;

      let attachmentHtml = "";
      if (msg.attachment) {
        attachmentHtml = `
          <div class="mb-2 inline-flex items-center gap-1.5 bg-gray-800/80 border border-gray-700 text-[11px] px-2.5 py-1 rounded text-blue-300">
            <i class="fa-solid fa-paperclip"></i>
            <span>${msg.attachment.filename} (${Math.round(msg.attachment.file_size_bytes / 1024)} KB)</span>
          </div>
        `;
      }

      let sourcesHtml = "";
      if (msg.sources && msg.sources.length > 0) {
        const pills = msg.sources.map(s => `<a href="${s}" target="_blank" class="inline-block bg-blue-900/30 hover:bg-blue-900/60 border border-blue-700/40 text-blue-300 text-[11px] px-2 py-0.5 rounded-full mr-1 mb-1 transition">📚 ${s}</a>`).join("");
        sourcesHtml = `<div class="mt-3 pt-2 border-t border-gray-700/50 flex flex-wrap gap-1">${pills}</div>`;
      }

      let feedbackHtml = "";
      if (!isUser) {
        const rating = msg.feedback ? msg.feedback.rating : null;
        feedbackHtml = `
          <div class="flex items-center gap-2 mt-2 text-xs text-gray-400">
            <button onclick="sendFeedback('${msg.id}', 1)" class="hover:text-green-400 ${rating === 1 ? 'text-green-400 font-bold' : ''}" title="Thumbs up">
              <i class="fa-regular fa-thumbs-up"></i>
            </button>
            <button onclick="sendFeedback('${msg.id}', -1)" class="hover:text-red-400 ${rating === -1 ? 'text-red-400 font-bold' : ''}" title="Thumbs down">
              <i class="fa-regular fa-thumbs-down"></i>
            </button>
            ${msg.latency_ms ? `<span class="text-[10px] text-gray-500 ml-2">⚡ ${msg.latency_ms}ms</span>` : ''}
          </div>
        `;
      }

      const contentFormatted = marked.parse(msg.content);

      if (isUser) {
        div.innerHTML = `
          <div class="max-w-2xl bg-blue-600 text-white px-4 py-3 rounded-2xl rounded-tr-sm shadow text-sm">
            ${attachmentHtml}
            <div>${msg.content}</div>
          </div>
          <div class="w-8 h-8 rounded-lg bg-gray-700 flex items-center justify-center text-xs font-semibold text-gray-300 flex-shrink-0">
            <i class="fa-solid fa-user"></i>
          </div>
        `;
      } else {
        div.innerHTML = `
          <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-xs font-semibold text-white flex-shrink-0">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div class="max-w-3xl bg-darkcard border border-gray-800 px-5 py-4 rounded-2xl rounded-tl-sm shadow text-sm text-gray-200 prose prose-invert">
            ${contentFormatted}
            ${sourcesHtml}
            ${feedbackHtml}
          </div>
        `;
      }

      messagesContainer.appendChild(div);
    }

    async function sendFeedback(messageId, rating) {
      try {
        await fetch(`/api/v1/messages/${messageId}/feedback`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rating: rating, issue_tags: [] }),
        });
        selectChat(activeSessionId);
      } catch (err) {
        console.error("Error submitting feedback:", err);
      }
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Submit Message Form
    document.getElementById("chatForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = messageInput.value.trim();
      if (!content && !currentAttachmentFile) return;

      if (!activeSessionId) await createNewChat();

      // Append user bubble optimistically
      const optimisticMsg = {
        role: "user",
        content: content,
        attachment: currentAttachmentFile ? { filename: currentAttachmentFile.name, file_size_bytes: currentAttachmentFile.size } : null,
      };
      appendMessageUI(optimisticMsg);
      scrollToBottom();

      // Reset form
      messageInput.value = "";
      messageInput.style.height = "auto";
      const fileToSend = currentAttachmentFile;
      removeAttachmentBtn.click();

      // Create Assistant placeholder bubble
      const assistantDiv = document.createElement("div");
      assistantDiv.className = "flex gap-3.5 justify-start";
      assistantDiv.innerHTML = `
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-xs font-semibold text-white flex-shrink-0">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div class="max-w-3xl bg-darkcard border border-gray-800 px-5 py-4 rounded-2xl rounded-tl-sm shadow text-sm text-gray-200 prose prose-invert">
          <span class="animate-pulse">Thinking & searching knowledge base...</span>
        </div>
      `;
      messagesContainer.appendChild(assistantDiv);
      scrollToBottom();

      // Send Multipart Form Data
      const formData = new FormData();
      formData.append("content", content || "Please analyze attached file");
      formData.append("stream", "false");
      if (fileToSend) {
        formData.append("attachment", fileToSend);
      }

      try {
        const res = await fetch(`/api/v1/chats/${activeSessionId}/messages`, {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        // Re-render complete chat
        selectChat(activeSessionId);
      } catch (err) {
        assistantDiv.querySelector(".prose").innerHTML = `<span class="text-red-400">Error generating response: ${err}</span>`;
      }
    });

    // Delete Chat
    document.getElementById("deleteChatBtn").addEventListener("click", async () => {
      if (!activeSessionId) return;
      if (confirm("Archive this conversation?")) {
        await fetch(`/api/v1/chats/${activeSessionId}`, { method: "DELETE" });
        activeSessionId = null;
        loadUserChats();
      }
    });

    // Export Chat
    document.getElementById("exportMdBtn").addEventListener("click", () => {
      if (!activeSessionId) return;
      window.open(`/api/v1/chats/${activeSessionId}/export?format=markdown`, "_blank");
    });

    document.getElementById("newChatBtn").addEventListener("click", createNewChat);
    document.getElementById("refreshUserChatsBtn").addEventListener("click", loadUserChats);

    // Initial Load
    loadUserChats();
  </script>
</body>
</html>
